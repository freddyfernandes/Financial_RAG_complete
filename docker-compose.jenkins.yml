services:
  jenkins:
    container_name: jenkins-local
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: llmops-jenkins:latest
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
